    <link rel="alternate" hreflang="en-gb" href="https://reflexinteractive.com/store.html">

    <!-- Open Graph / Facebook -->

    <meta property="og:description" content="Purchase Reflex Interactive games and digital items directly from our official store.">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@MadeByReflex">
    <meta name="twitter:creator" content="@MadeByReflex">
    <meta name="twitter:title" content="Store | Reflex Interactive">

    <!-- Favicons & Icons -->
    <link rel="icon" href="https://res.cloudinary.com/dvju1xiaw/image/upload/q_auto/f_auto/v1778532761/Reflex_Interactive_Logo_no_back_srtf76.ico" sizes="any">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dvju1xiaw/image/upload/v1778532761/Reflex_Interactive_Logo_no_back_srtf76.png">

    <!-- Resource Hints & Performance Optimizations -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CSS Dependencies -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-black text-white overflow-x-hidden">
    
    <div id="navbar"></div>

    <main id="main-content" class="container pt-4 pt-md-5 flex-grow-1 w-100">
        <!-- Full Store Grid View -->
        <div id="store-grid-view">
            <section id="store-catalog" class="py-5 page-hero" aria-labelledby="store-heading">
                <div class="page-intro mx-auto mb-5 text-center">
                    <p class="section-kicker mb-3">Stripe Store</p>
                    <h1 id="store-heading" class="display-3 fw-bold">
                        Game Releases & Store
                    </h1>
                    <p class="fs-5 text-muted mb-0">
                        Purchase official Reflex Interactive game licenses and releases securely.
                    </p>
                </div>
                
                <div id="store-loading-spinner" class="loading-zone d-flex justify-content-center align-items-center" aria-label="Loading our store products.">
                    <div class="spinner-border text-danger" role="status"></div>
                </div>
                
                <div id="store-products-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
            </section>
        </div>

        <!-- Single Product Full Page View (Loaded dynamically via URL ?id=...) -->
        <div id="store-detail-view" class="d-none py-5">
            <div class="mb-4">
                <a href="/store.html" class="text-decoration-none text-light">
                    &larr; Back to Store
                </a>
            </div>
            <div class="row g-5 align-items-start">
                <div class="col-lg-6">
                    <div class="rounded-4 overflow-hidden border mb-3 position-relative bg-dark" style="aspect-ratio: 16 / 9;">
                        <img id="detail-image" src="" alt="Product Image" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0" />
                    </div>
                </div>
                <div class="col-lg-6 d-flex flex-column gap-3">
                    <span id="detail-type" class="badge bg-secondary mb-2 align-self-start">Game</span>
                    <h1 id="detail-title" class="display-5 fw-bold mb-0 text-white"></h1>
                    <div id="detail-price" class="fs-3 fw-bold text-danger mb-0"></div>
                    
                    <div class="p-3 rounded-3 border border-secondary d-flex align-items-center gap-2 small bg-dark text-light">
                        <div>
                            <strong>Instant Delivery:</strong> Digital license key provided immediately upon checkout completion.
                        </div>
                    </div>

                    <p id="detail-description" class="text-muted" style="white-space: pre-line;"></p>
                    <div class="mt-3">
                        <button id="detail-checkout-btn" type="button" class="btn btn-danger btn-lg w-100">Buy Now</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>
    
    <script src="./js/site-config.js"></script>
    <script src="./js/app.js" defer></script>
</body>
</html>
