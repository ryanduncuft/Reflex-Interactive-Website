[build]
  publish = "."
  command = "./scripts/write-firebase-config.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# === 1. Domain Normalization ===
# Redirect WWW and Netlify subdomain to Naked Domain
[[redirects]]
  from = "https://www.reflexinteractive.com/*"
  to = "https://reflexinteractive.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://reflexinteractive.netlify.app/*"
  to = "https://reflexinteractive.com/:splat"
  status = 301
  force = true

# === 2. Subdomain Logic ===
# SUPPORT SUBDOMAIN
# Serve shared static assets directly on app subdomains to avoid dev/prod surprises.
[[redirects]]
  from = "https://support.reflexinteractive.com/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "https://support.reflexinteractive.com/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "https://support.reflexinteractive.com/components/*"
  to = "/components/:splat"
  status = 200

[[redirects]]
  from = "https://careers.reflexinteractive.com/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "https://careers.reflexinteractive.com/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "https://careers.reflexinteractive.com/components/*"
  to = "/components/:splat"
  status = 200

[[redirects]]
  from = "https://account.reflexinteractive.com/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "https://account.reflexinteractive.com/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "https://account.reflexinteractive.com/components/*"
  to = "/components/:splat"
  status = 200

# 1. Serve support.html at the root of the support subdomain
[[redirects]]
  from = "https://support.reflexinteractive.com/"
  to = "/support.html"
  status = 200
  force = true

# 2. If a user clicks a link like "/games" while on the support subdomain, force them back to the main domain
[[redirects]]
  from = "https://support.reflexinteractive.com/*"
  to = "https://reflexinteractive.com/:splat"
  status = 301
  force = true

# CAREERS SUBDOMAIN
[[redirects]]
  from = "https://careers.reflexinteractive.com/"
  to = "/careers.html"
  status = 200
  force = true

# ACCOUNT SUBDOMAIN
[[redirects]]
  from = "https://account.reflexinteractive.com/"
  to = "/account.html"
  status = 200
  force = true

[[redirects]]
  from = "https://account.reflexinteractive.com/*"
  to = "/account.html"
  status = 200
  force = true

[[redirects]]
  from = "https://careers.reflexinteractive.com/*"
  to = "https://reflexinteractive.com/:splat"
  status = 301
  force = true

# === 3. Main Domain to Subdomain Redirects ===
# When users click /support, /careers, or /account on the main site, send them to the subdomains
[[redirects]]
  from = "/support"
  to = "https://support.reflexinteractive.com/"
  status = 301
  force = true

[[redirects]]
  from = "/careers"
  to = "https://careers.reflexinteractive.com/"
  status = 301
  force = true

[[redirects]]
  from = "/account"
  to = "https://account.reflexinteractive.com/"
  status = 301
  force = true

# === 4. Clean URLs & Routing ===
[[redirects]]
  from = "/games"
  query = {id = ":id"}
  to = "/game-details.html"
  status = 200

[[redirects]]
  from = "/game-details"
  query = {id = ":id"}
  to = "/game-details.html"
  status = 200

[[redirects]]
  from = "/newswire"
  query = {id = ":id"}
  to = "/newswire-details?id=:id"
  status = 301

[[redirects]]
  from = "/newswire-details"
  query = {id = ":id"}
  to = "/newswire-details.html"
  status = 200

[[redirects]]
  from = "/games"
  to = "/games.html"
  status = 200

[[redirects]]
  from = "/game-details"
  to = "/game-details.html"
  status = 200

[[redirects]]
  from = "/newswire"
  to = "/newswire.html"
  status = 200

[[redirects]]
  from = "/newswire-details"
  to = "/newswire-details.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# === 5. Fallbacks & Headers ===
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://www.google-analytics.com; connect-src 'self' https://gist.githubusercontent.com https://cdn.reflexinteractive.com https://downloads.reflexinteractive.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://www.google-analytics.com; frame-src 'none'"

[[headers]]
  for = "/js/firebase-config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
